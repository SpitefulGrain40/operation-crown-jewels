<style>
  :root {
    --gold: #8b6914;
    --gold-light: #c9a84c;
    --paper: #fdf3e3;
    --paper-dark: #f0e0c0;
    --ink: #2e1c08;
    --ink-mid: #5c3d0a;
    --red: #c0392b;
    --green: #2e7d32;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1008;
    min-height: 100vh;
    padding: 30px 16px 60px;
    font-family: 'IM Fell English', serif;
  }

  .page-title {
    text-align: center;
    margin-bottom: 28px;
  }
  .page-title .crown { font-size: 36px; margin-bottom: 6px; }
  .page-title h1 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .page-title p {
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    color: rgba(201,168,76,0.6);
    letter-spacing: 2px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Progress bar */
  .progress-wrap {
    max-width: 680px;
    margin: 0 auto 28px;
    background: rgba(139,105,20,0.15);
    border: 1px solid rgba(139,105,20,0.3);
    border-radius: 4px;
    padding: 14px 18px;
  }
  .progress-label {
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    color: var(--gold-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .progress-bar-bg {
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 4px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Section */
  .section {
    max-width: 680px;
    margin: 0 auto 22px;
    background: var(--paper);
    border: 2px solid var(--gold);
    position: relative;
  }

  .section::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(139,105,20,0.25);
    pointer-events: none;
  }

  .section-header {
    background: var(--gold);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--paper);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .section-count {
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    color: rgba(253,243,227,0.7);
    letter-spacing: 1px;
  }

  .section-body { padding: 8px 0; }

  /* Task item */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 9px 18px;
    border-bottom: 1px solid rgba(139,105,20,0.12);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .task:last-child { border-bottom: none; }
  .task:hover { background: rgba(139,105,20,0.05); }
  .task.done { opacity: 0.55; }

  .task input[type="checkbox"] { display: none; }

  .check-box {
    width: 20px;
    height: 20px;
    border: 2px solid var(--gold);
    background: transparent;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
  }
  .check-box::after {
    content: '✓';
    font-size: 13px;
    color: var(--green);
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .task.done .check-box {
    border-color: var(--green);
    background: rgba(46,125,50,0.08);
  }
  .task.done .check-box::after { opacity: 1; }

  .task-content { flex: 1; }

  .task-label {
    font-family: 'IM Fell English', serif;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.4;
    transition: color 0.2s;
  }
  .task.done .task-label {
    text-decoration: line-through;
    color: #999;
  }

  .task-note {
    font-family: 'Special Elite', monospace;
    font-size: 10px;
    color: var(--gold);
    margin-top: 2px;
    letter-spacing: 0.5px;
    opacity: 0.8;
  }

  .task-tag {
    font-family: 'Special Elite', monospace;
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .tag-buy { background: rgba(192,57,43,0.12); color: var(--red); border: 1px solid rgba(192,57,43,0.3); }
  .tag-print { background: rgba(25,118,210,0.1); color: #1565c0; border: 1px solid rgba(25,118,210,0.25); }
  .tag-setup { background: rgba(46,125,50,0.1); color: #2e7d32; border: 1px solid rgba(46,125,50,0.25); }

  /* All done banner */
  .all-done {
    max-width: 680px;
    margin: 0 auto;
    text-align: center;
    padding: 20px;
    border: 2px solid var(--gold);
    background: rgba(139,105,20,0.1);
    display: none;
  }
  .all-done.show { display: block; }
  .all-done p {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold-light);
    letter-spacing: 2px;
  }
</style>
</head>

<script>
  const tasks = document.querySelectorAll('.task');
  const fillBar = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');
  const allDone = document.getElementById('all-done');

  function setTask(task, i, isDone) {
    task.classList.toggle('done', isDone);
    task.querySelector('input').checked = isDone;
    try { localStorage.setItem('crown_task_' + i, isDone ? 'done' : ''); } catch(e) {}
    updateProgress();
  }

  // Load saved state & attach handlers
  tasks.forEach((task, i) => {
    try {
      if (localStorage.getItem('crown_task_' + i) === 'done') {
        task.classList.add('done');
        task.querySelector('input').checked = true;
      }
    } catch(e) {}

    // Prevent label's default behaviour (which would double-fire the toggle)
    task.addEventListener('click', (e) => {
      e.preventDefault();
      const isDone = !task.classList.contains('done');
      setTask(task, i, isDone);
    });
  });

  function updateProgress() {
    const total = tasks.length;
    const done = document.querySelectorAll('.task.done').length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    fillBar.style.width = pct + '%';
    progressText.textContent = done + ' / ' + total + ' complete';
    allDone.classList.toggle('show', done === total);

    ['buy','print','setup'].forEach(sec => {
      const secTasks = document.querySelectorAll(`.task[data-section="${sec}"]`);
      const secDone = document.querySelectorAll(`.task[data-section="${sec}"].done`).length;
      const el = document.getElementById('count-' + sec);
      if (el) el.textContent = secDone + ' / ' + secTasks.length;
    });
  }

  updateProgress();
</script>
</body>
</html>
